[package]
name = "snp-stack"
description = "ShareNet transparent networking stack — packet flow classification (N2.3.2)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
snp-tun.workspace = true
snp-node = { workspace = true, optional = true }
snp-gateway = { workspace = true, optional = true }
snp-crypto = { workspace = true, optional = true }
snp-link = { workspace = true, optional = true }
thiserror.workspace = true
tokio.workspace = true
smoltcp.workspace = true
async-trait.workspace = true
sha2.workspace = true

[features]
default = []
# Enable the real ShareNet circuit-backed upstream (requires the full
# ShareNet stack). This is a production feature — tests use MockUpstream
# which doesn't need this.
circuit-upstream = ["dep:snp-node", "dep:snp-gateway", "dep:snp-crypto", "dep:snp-link"]
# N2.5-R.2 — Expose test-only helpers (e.g. `EstablishedRoute::test_with_route_id`,
# `MigrationDecision::test_tampered_to_route_id`) for use in integration tests.
# This feature MUST NOT be enabled in production builds — it bypasses the
# "evidence cannot be fabricated" invariant for negative testing.
test-utils = []

[[test]]
name = "runtime_migration"
required-features = ["circuit-upstream", "test-utils"]

[[test]]
name = "circuit_lifecycle_tests"
required-features = ["circuit-upstream", "test-utils"]

[dev-dependencies]
tokio.workspace = true
snp-node = { workspace = true, features = ["test-utils"] }
snp-gateway.workspace = true
snp-crypto.workspace = true
snp-link.workspace = true
url.workspace = true
getrandom = "0.2"
sha2.workspace = true
rand = "0.8"

[lib]
name = "snp_stack"
path = "src/lib.rs"
