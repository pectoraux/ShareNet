[package]
name = "snp-link"
description = "L8 Link abstraction — AEAD-encrypted frame transport over TCP"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
# N2.1.2.4: Expose test-only constructors for VerifiedHandshake that bypass
# the actual SNP-IK handshake. This feature MUST NOT be enabled in production.
test-support = []

[dependencies]
snp-cbor.workspace = true
snp-crypto.workspace = true
snp-identity.workspace = true
snp-frames.workspace = true
thiserror.workspace = true
getrandom = "0.2"
tokio = { workspace = true, features = ["net", "io-util", "sync", "rt", "macros", "time"] }

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }
# N2.1.2.4: Enable test-only VerifiedHandshake factory for snp-link's own
# unit tests.
snp-link = { path = ".", features = ["test-support"] }
