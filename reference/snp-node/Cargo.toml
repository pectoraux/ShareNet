[package]
name = "snp-node"
description = "ShareNet 2.0 reference daemon — Client/Relay/Gateway modes for N1.8"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
default-run = "snp-node"

[features]
default = []
# Enable legacy N1.9/N2.0 demo code (GatewayChoice, deterministic seeds).
# This is NOT needed for production — it exists only for backward-compat tests.
legacy-demo = []
# N2.0.7.2: Enable the OLD circuit-key gateway/client APIs that accept
# externally-supplied CircuitKeys. These APIs are OUT OF BAND — the gateway
# receives pre-computed circuit keys instead of deriving them from the
# protocol. They exist ONLY for backward-compat with N2.0.6/N2.0.7 tests
# that haven't been migrated yet. The PRODUCTION BUILD (`cargo build`)
# does NOT enable this feature — the old APIs are physically absent from
# the production binary.
legacy-circuit-keys = []
# N2.3: Expose test-only APIs that bypass the circuit-owned sequence
# allocator (wrap_packet_for_testing, CircuitSender::new_at_seq_for_testing).
# These are physically ABSENT from normal production builds (`cargo build`)
# — an external crate cannot call them. Integration tests enable this via
# the [dev-dependencies] self-reference below, which always turns the
# feature on for `cargo test`. The PRODUCTION BINARY MUST NOT enable this
# feature; the architectural guard verifies the symbols are absent from a
# default-feature build.
test-utils = []

[[bin]]
name = "snp-node"
path = "src/main.rs"

[[bin]]
name = "mesh-session-demo"
path = "src/bin/mesh_session_demo.rs"

[dependencies]
snp-cbor.workspace = true
snp-crypto.workspace = true
snp-object.workspace = true
snp-identity.workspace = true
snp-frames.workspace = true
snp-link.workspace = true
snp-routing.workspace = true
snp-gateway.workspace = true
thiserror.workspace = true
tokio.workspace = true
getrandom = "0.2"

[dev-dependencies]
# Self-reference so integration tests (tests/*.rs) always compile against
# the test-utils feature. This does NOT affect downstream crates that depend
# on snp-node — they only get test-utils if they explicitly request it.
snp-node = { path = ".", features = ["test-utils"] }
serde_json.workspace = true
url.workspace = true

# N2.0.7.3: The legacy-circuit-keys feature is NOT enabled by default for
# tests. `cargo test` runs ONLY the new production architecture. To run the
# legacy compatibility suite:
#   cargo test --features legacy-circuit-keys
# Legacy tests are isolated in tests/legacy/ and require the explicit flag.
